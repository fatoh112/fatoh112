name: GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "github-metrics.svg"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate privacy-safe dashboard
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python .github/scripts/generate_metrics.py

      - name: Commit dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
          else
            git commit -m "Update GitHub profile dashboard [skip ci]"
            git push
          fi
