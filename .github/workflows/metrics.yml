name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fatoh112

          # Appearance
          filename: github-metrics.svg
          template: terminal
          config_display: large
          config_timezone: Africa/Cairo
          config_animations: yes

          # Dark GitHub-style terminal
          extras_css: |
            svg {
              color: #c9d1d9 !important;
            }

            pre {
              background: #0d1117 !important;
              color: #c9d1d9 !important;
              border: 1px solid #30363d !important;
              border-top: 0 !important;
              box-shadow: 0 8px 30px rgba(0,0,0,.35);
            }

            .header {
              background: linear-gradient(
                90deg,
                #161b22 0%,
                #21262d 100%
              ) !important;
              border: 1px solid #30363d !important;
              border-bottom: 0 !important;
            }

            .title {
              color: #f0f6fc !important;
            }

            .ps1-path {
              color: #3fb950 !important;
            }

            .ps1-location {
              color: #58a6ff !important;
            }

            .diff {
              color: #58a6ff !important;
            }

            .banner,
            footer {
              color: #8b949e !important;
            }

          # Main stats
          base: header, activity, community, repositories, metadata

          # PRIVATE-SAFE totals:
          # includes aggregate added/removed lines
          # but does NOT list repository names
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 30

          # Aggregate languages only
          plugin_languages: yes
          plugin_languages_limit: 7
          plugin_languages_ignored: html, css

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
