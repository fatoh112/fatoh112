name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}

          # Output
          filename: github-metrics.svg
          template: classic

          # Timezone
          config_timezone: Africa/Cairo

          # ========================================
          # GENERAL PROFILE STATS
          # ========================================
          base: header, activity, community, repositories, metadata

          # ========================================
          # LINES OF CODE
          # ========================================
          plugin_lines: yes

          # Total additions/deletions
          # Top repositories
          # Historical graph
          plugin_lines_sections: base, repositories, history

          plugin_lines_repositories_limit: 5
          plugin_lines_history_limit: 2

          # Re-query GitHub statistics for better accuracy
          plugin_lines_delay: 30

          # ========================================
          # PROGRAMMING LANGUAGES
          # ========================================
          plugin_languages: yes

          plugin_languages_ignored: html, css

          plugin_languages_limit: 8

          # ========================================
          # CONTRIBUTION CALENDAR
          # ========================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
