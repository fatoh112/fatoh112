name: GitHub Profile Metrics

on:
  schedule:
    # Update every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Authentication
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}

          # Output
          filename: github-metrics.svg
          template: classic

          # Cairo timezone
          config_timezone: Africa/Cairo

          # =========================
          # GENERAL PROFILE STATS
          # =========================
          base: header, activity, community, repositories, metadata

          # =========================
          # LINES OF CODE
          # =========================
          # Shows:
          # - Total lines added
          # - Total lines removed
          # - Repositories with most changes
          # - Change history graph
          plugin_lines: yes

          plugin_lines_sections: base, repositories, history

          # Show top 5 repositories by code changes
          plugin_lines_repositories_limit: 5

          # Show last 2 years of additions/deletions history
          plugin_lines_history_limit: 2

          # GitHub's statistics endpoint can initially return cached values.
          # Waiting and querying again can improve accuracy.
          plugin_lines_delay: 30

          # =========================
          # PROGRAMMING LANGUAGES
          # =========================
          plugin_languages: yes

          # Don't count HTML/CSS as main programming languages
          plugin_languages_ignored: html, css

          # Maximum languages displayed
          plugin_languages_limit: 8

          # =========================
          # YEARLY CONTRIBUTION CALENDAR
          # =========================
          # 3D/isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================
          # CODING HABITS
          # =========================
          # Shows things such as:
          # - Most active coding time
          # - Most active day
          # - Commit activity by hour
          # - Commit activity by weekday
          # - Recent language activity
          plugin_habits: yes

          # Use more events for better accuracy
          plugin_habits_from: 500

          # Look at the last 30 days
          plugin_habits_days: 30

          # Interesting coding facts
          plugin_habits_facts: yes

          # Activity charts
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

          # Remove empty hours from activity graph
          plugin_habits_trim: yes

          # Languages shown in habits section
          plugin_habits_languages_limit: 8
